# Company OS — pull and run. No compilation on this machine.
#
#   bash install.sh          # generates .env, pulls, starts, verifies
#   docker compose -f docker-compose.company-os.yml up -d
#
# Console: http://127.0.0.1:3050 · API health: http://127.0.0.1:3847/api/company/health
#
# There is deliberately no `build:` section here: a failed pull must fail, not
# silently start a 20-minute source build on an operator's laptop. To build the
# image locally, add the override:
#   docker compose -f docker-compose.company-os.yml -f docker-compose.build.yml build

name: company-os

services:
  postgres:
    # pgvector, not stock postgres: the memory substrate migration declares
    # vector(768) columns and an ivfflat index, and a plain postgres image dies
    # there mid-migration.
    image: ${COMPANY_OS_POSTGRES_IMAGE:-pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b}
    environment:
      POSTGRES_USER: ${COMPANY_OS_SUPERUSER:-hsm}
      POSTGRES_PASSWORD: ${COMPANY_OS_SUPERUSER_PASSWORD:?generated by install.sh}
      POSTGRES_DB: ${COMPANY_OS_DATABASE:-hsm_company_os}
    ports:
      - "127.0.0.1:${COMPANY_OS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - company-os-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMPANY_OS_SUPERUSER:-hsm} -d ${COMPANY_OS_DATABASE:-hsm_company_os}"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    restart: unless-stopped

  # Cluster-global roles, provisioned once by a superuser before any migration
  # runs. Idempotent, so a restart is a no-op rather than a conflict.
  bootstrap:
    image: ${COMPANY_OS_IMAGE:?immutable image digest resolved by install.sh}
    command: ["bash", "/app/infrastructure/docker/postgres-init/10-company-os-roles.sh"]
    environment:
      COMPANY_OS_SUPERUSER_URL: postgres://${COMPANY_OS_SUPERUSER:-hsm}:${COMPANY_OS_SUPERUSER_PASSWORD}@postgres:5432/${COMPANY_OS_DATABASE:-hsm_company_os}
      COMPANY_OS_MIGRATION_PASSWORD: ${COMPANY_OS_MIGRATION_PASSWORD:?generated by install.sh}
      COMPANY_OS_RUNTIME_PASSWORD: ${COMPANY_OS_RUNTIME_PASSWORD:?generated by install.sh}
      COMPANY_OS_EXECUTOR_PASSWORD: ${COMPANY_OS_EXECUTOR_PASSWORD:?generated by install.sh}
      COMPANY_OS_RECONCILER_PASSWORD: ${COMPANY_OS_RECONCILER_PASSWORD:?generated by install.sh}
      COMPANY_OS_READONLY_PASSWORD: ${COMPANY_OS_READONLY_PASSWORD:?generated by install.sh}
      COMPANY_OS_VCS_BROKER_PASSWORD: ${COMPANY_OS_VCS_BROKER_PASSWORD:?generated by install.sh}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${COMPANY_OS_IMAGE:?immutable image digest resolved by install.sh}
    command: ["hsm_console", "--host", "0.0.0.0", "--port", "3847"]
    ports:
      - "127.0.0.1:${COMPANY_OS_API_PORT:-3847}:3847"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      HSM_DATA_DIR: /app/data
      HSM_LOG_DIR: /app/logs
      # Five least-privilege lanes. Startup refuses to run if any is missing or
      # shares credentials with another — see
      # docs/company-os/DATABASE_ROLE_AND_TERMINAL_RECEIPTS.md.
      HSM_COMPANY_OS_DATABASE_URL: postgres://company_runtime_login:${COMPANY_OS_RUNTIME_PASSWORD}@postgres:5432/${COMPANY_OS_DATABASE:-hsm_company_os}
      HSM_COMPANY_OS_MIGRATION_DATABASE_URL: postgres://company_migration_login:${COMPANY_OS_MIGRATION_PASSWORD}@postgres:5432/${COMPANY_OS_DATABASE:-hsm_company_os}
      HSM_COMPANY_OS_EXECUTOR_DATABASE_URL: postgres://company_executor_login:${COMPANY_OS_EXECUTOR_PASSWORD}@postgres:5432/${COMPANY_OS_DATABASE:-hsm_company_os}
      HSM_COMPANY_OS_RECONCILIATION_DATABASE_URL: postgres://company_reconciler_login:${COMPANY_OS_RECONCILER_PASSWORD}@postgres:5432/${COMPANY_OS_DATABASE:-hsm_company_os}
      HSM_COMPANY_OS_READ_ONLY_DATABASE_URL: postgres://company_readonly_login:${COMPANY_OS_READONLY_PASSWORD}@postgres:5432/${COMPANY_OS_DATABASE:-hsm_company_os}
      HSM_COMPANY_API_BEARER_TOKEN: ${COMPANY_OS_API_TOKEN:?generated by install.sh}
      COMPANY_OS_PROFILE: ${COMPANY_OS_PROFILE:-companion}
      HSM_COMPANY_OS_COMPANION: ${HSM_COMPANY_OS_COMPANION:-1}
      HSM_OPTIONAL_BACKGROUND_WORKERS: ${HSM_OPTIONAL_BACKGROUND_WORKERS:-0}
      HSM_MEMORY_EMBED_ENABLED: ${HSM_MEMORY_EMBED_ENABLED:-0}
      HSM_COMPANY_OS_ALLOW_DEGRADED: ${HSM_COMPANY_OS_ALLOW_DEGRADED:-1}
      # Release images contain their exact migration versions but no Git
      # checkout. The entrypoint turns this into the explicit provenance
      # allowlist used by the runtime migration guard.
      HSM_COMPANY_OS_ALLOW_IMAGE_MIGRATIONS: ${HSM_COMPANY_OS_ALLOW_IMAGE_MIGRATIONS:-1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_BASE: ${OPENROUTER_API_BASE:-}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-}
      HSM_AGENT_CHAT_MODEL: ${HSM_AGENT_CHAT_MODEL:-}
      HSM_COMPANY_LLM_MAX_CONCURRENT: ${HSM_COMPANY_LLM_MAX_CONCURRENT:-4}
      # RTK only compacts eligible model-facing shell output. ToolRegistry still
      # admits the original command and RTK absence falls back to raw output.
      HSM_RTK_MODE: ${HSM_RTK_MODE:-auto}
      HSM_RTK_BIN: /usr/local/bin/rtk
      HSM_RTK_RECALL_DB: /app/data/rtk/recall.db
      RTK_TELEMETRY_DISABLED: "1"
      # Finite worst-user ceilings for the model gateway for every company that
      # has no company_llm_gateway_policy row. Images built before 2026-09-15 treat
      # an unset value as unbounded; current source falls back to these same values.
      HSM_GATEWAY_DEFAULT_DAILY_SPEND_CAP_USD: ${HSM_GATEWAY_DEFAULT_DAILY_SPEND_CAP_USD:-25}
      HSM_GATEWAY_DEFAULT_MONTHLY_SPEND_CAP_USD: ${HSM_GATEWAY_DEFAULT_MONTHLY_SPEND_CAP_USD:-250}
      HSM_GATEWAY_DEFAULT_MAX_THREAD_TURNS: ${HSM_GATEWAY_DEFAULT_MAX_THREAD_TURNS:-200}
      HSM_GATEWAY_DEFAULT_MAX_COMPLETION_TOKENS_PER_RUN: ${HSM_GATEWAY_DEFAULT_MAX_COMPLETION_TOKENS_PER_RUN:-200000}
      # USD per 1k completion tokens used to meter spend; unset refuses paid work.
      HSM_LLM_PRICE_PER_1K_OUTPUT_TOKENS_USD: ${HSM_LLM_PRICE_PER_1K_OUTPUT_TOKENS_USD:-0.002}
      # Ledger -> OpenTelemetry span projection. Off unless the observability
      # overlay (docker-compose.observability.yml) is up AND the image was built
      # with the `otlp-telemetry` feature; otherwise the server logs a warning
      # and runs normally.
      HSM_OTEL_LEDGER_PROJECTION: ${HSM_OTEL_LEDGER_PROJECTION:-0}
      HSM_OTEL_EXPORTER_OTLP_ENDPOINT: ${HSM_OTEL_EXPORTER_OTLP_ENDPOINT:-http://data-prepper:21890}
      HSM_OTEL_SERVICE_NAME: ${HSM_OTEL_SERVICE_NAME:-company-os}
      HSM_OPENSEARCH_QUERY_URL: ${HSM_OPENSEARCH_QUERY_URL:-http://opensearch:9200}
      HSM_OPENSEARCH_QUERY_USERNAME: ${HSM_OPENSEARCH_QUERY_USERNAME:-}
      HSM_OPENSEARCH_QUERY_PASSWORD: ${HSM_OPENSEARCH_QUERY_PASSWORD:-}
      HSM_OPENSEARCH_QUERY_BEARER_TOKEN: ${HSM_OPENSEARCH_QUERY_BEARER_TOKEN:-}
    volumes:
      - company-os-data:/app/data
      - company-os-logs:/app/logs
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3847/api/company/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      # First boot applies the embedded migrations before the port opens.
      start_period: 90s
    restart: unless-stopped

  console:
    image: ${COMPANY_OS_IMAGE:?immutable image digest resolved by install.sh}
    working_dir: /app/console
    command: ["node", "server.js"]
    ports:
      - "127.0.0.1:${COMPANY_OS_CONSOLE_PORT:-3050}:3050"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3050"
      # The console's route handlers proxy /api/company/* to the API service.
      HSM_CONSOLE_URL: http://api:3847
      HSM_COMPANY_API_BEARER_TOKEN: ${COMPANY_OS_API_TOKEN}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  company-os-pgdata:
  company-os-data:
  company-os-logs:
