# Credential-bound OpenRouter overlay. The installer writes this file beside
# the base stack only for an explicit --credential-gateway install.
name: ${COMPOSE_PROJECT_NAME:?generated by install.sh}

services:
  postgres:
    networks: [control]

  bootstrap:
    networks: [control]

  api:
    networks: [control]
    environment:
      COMPANY_OS_PROFILE: full
      HSM_COMPANY_OS_COMPANION: "0"
      HSM_OPTIONAL_BACKGROUND_WORKERS: "0"
      HSM_MEMORY_EMBED_ENABLED: "0"
      HSM_COMPANY_OS_ALLOW_DEGRADED: "0"
      # This is the generated local bearer token, never the provider key.
      OPENROUTER_API_KEY: ${HSM_CREDENTIAL_GATEWAY_TOKEN:?generated by install.sh}
      OPENROUTER_BASE_URL: http://credential-gateway:3850/api/v1
      OPENROUTER_API_BASE: http://credential-gateway:3850/api/v1
      HSM_LLM_PROVIDER_ORDER: openrouter
      HSM_LLM_PROVIDER: openrouter
      HSM_CREDENTIAL_BOUNDARY: openrouter-gateway-v1
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      credential-gateway:
        condition: service_healthy

  console:
    networks: [control]
    environment:
      HSM_CONSOLE_CODE_AGENT: hsm_native_worker

  credential-gateway:
    image: ${COMPANY_OS_IMAGE:?immutable image digest resolved by install.sh}
    user: "${HSM_CREDENTIAL_GATEWAY_UID:?}:${HSM_CREDENTIAL_GATEWAY_GID:?}"
    command: ["node", "/app/services/company-os-credential-gateway/server.mjs"]
    environment:
      HSM_CREDENTIAL_BOUNDARY: openrouter-gateway-v1
      HSM_CREDENTIAL_GATEWAY_KEY_FILE: /run/secrets/openrouter-key
      HSM_CREDENTIAL_GATEWAY_TOKEN_FILE: /run/secrets/gateway-token
      HSM_CREDENTIAL_GATEWAY_PORT: "3850"
    volumes:
      - "${HSM_CREDENTIAL_GATEWAY_SECRETS_DIR:?}/openrouter-key:/run/secrets/openrouter-key:ro"
      - "${HSM_CREDENTIAL_GATEWAY_SECRETS_DIR:?}/gateway-token:/run/secrets/gateway-token:ro"
    networks: [control, egress]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3850/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  control:
    internal: true
  egress: {}
